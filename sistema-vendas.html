<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .section h2 {
            color: #555;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        .btn-success {
            background-color: #28a745;
        }
        
        .btn-success:hover {
            background-color: #1e7e34;
        }
        
        .carrinho {
            background-color: #f8f9fa;
        }
        
        .item-carrinho {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item-carrinho:last-child {
            border-bottom: none;
        }
        
        .btn-remover {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .btn-remover:hover {
            background-color: #c82333;
        }
        
        .resumo {
            background-color: #e9ecef;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .hidden {
            display: none;
        }
        
        .cliente-info {
            background-color: #d4edda;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Vendas</h1>
        
        <!-- Cadastro do Cliente -->
        <div id="cadastro-cliente" class="section">
            <h2>Cadastro do Cliente</h2>
            <div class="form-group">
                <label for="nome-cliente">Nome do Cliente:</label>
                <input type="text" id="nome-cliente" placeholder="Digite o nome do cliente">
            </div>
            <button onclick="cadastrarCliente()">Confirmar Cadastro</button>
        </div>
        
        <!-- Área de Vendas -->
        <div id="area-vendas" class="hidden">
            <div class="cliente-info">
                <strong>Cliente: </strong><span id="cliente-atual"></span>
            </div>
            
            <!-- Adicionar Produtos -->
            <div class="section">
                <h2>Adicionar Produtos</h2>
                <div class="form-group">
                    <label for="nome-produto">Nome do Produto:</label>
                    <input type="text" id="nome-produto" placeholder="Digite o nome do produto">
                </div>
                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" value="1">
                </div>
                <button onclick="adicionarProduto()">Adicionar ao Carrinho</button>
            </div>
            
            <!-- Carrinho de Compras -->
            <div class="section carrinho">
                <h2>Carrinho de Compras</h2>
                <div id="itens-carrinho">
                    <p>Carrinho vazio</p>
                </div>
                <button class="btn-success" onclick="finalizarCompra()" id="btn-finalizar" disabled>Finalizar Compra</button>
            </div>
        </div>
        
        <!-- Resumo da Compra -->
        <div id="resumo-compra" class="hidden">
            <div class="resumo">
                <h2>Resumo da Compra</h2>
                <div id="detalhes-compra"></div>
                <button onclick="novaVenda()">Nova Venda</button>
            </div>
        </div>
    </div>

    <script>
        let cliente = '';
        let carrinho = [];

        function cadastrarCliente() {
            const nomeCliente = document.getElementById('nome-cliente').value.trim();
            
            if (!nomeCliente) {
                alert('Por favor, digite o nome do cliente');
                return;
            }
            
            cliente = nomeCliente;
            document.getElementById('cliente-atual').textContent = cliente;
            document.getElementById('cadastro-cliente').classList.add('hidden');
            document.getElementById('area-vendas').classList.remove('hidden');
        }

        function adicionarProduto() {
            const nomeProduto = document.getElementById('nome-produto').value.trim();
            const quantidade = parseInt(document.getElementById('quantidade').value);
            
            if (!nomeProduto) {
                alert('Por favor, digite o nome do produto');
                return;
            }
            
            if (!quantidade || quantidade < 1) {
                alert('Por favor, digite uma quantidade válida');
                return;
            }
            
            // Verificar se produto já existe no carrinho
            const produtoExistente = carrinho.find(item => item.nome === nomeProduto);
            
            if (produtoExistente) {
                produtoExistente.quantidade += quantidade;
            } else {
                carrinho.push({
                    nome: nomeProduto,
                    quantidade: quantidade
                });
            }
            
            atualizarCarrinho();
            
            // Limpar campos
            document.getElementById('nome-produto').value = '';
            document.getElementById('quantidade').value = '1';
        }

        function atualizarCarrinho() {
            const itensCarrinho = document.getElementById('itens-carrinho');
            const btnFinalizar = document.getElementById('btn-finalizar');
            
            if (carrinho.length === 0) {
                itensCarrinho.innerHTML = '<p>Carrinho vazio</p>';
                btnFinalizar.disabled = true;
                return;
            }
            
            let html = '';
            carrinho.forEach((item, index) => {
                html += `
                    <div class="item-carrinho">
                        <span><strong>${item.nome}</strong> - Quantidade: ${item.quantidade}</span>
                        <button class="btn-remover" onclick="removerItem(${index})">Remover</button>
                    </div>
                `;
            });
            
            itensCarrinho.innerHTML = html;
            btnFinalizar.disabled = false;
        }

        function removerItem(index) {
            carrinho.splice(index, 1);
            atualizarCarrinho();
        }

        function finalizarCompra() {
            if (carrinho.length === 0) {
                alert('Carrinho está vazio');
                return;
            }
            
            let resumoHtml = `
                <p><strong>Cliente:</strong> ${cliente}</p>
                <h3>Produtos Comprados:</h3>
                <ul>
            `;
            
            carrinho.forEach(item => {
                resumoHtml += `<li>${item.nome} - Quantidade: ${item.quantidade}</li>`;
            });
            
            resumoHtml += '</ul>';
            
            document.getElementById('detalhes-compra').innerHTML = resumoHtml;
            document.getElementById('area-vendas').classList.add('hidden');
            document.getElementById('resumo-compra').classList.remove('hidden');
        }

        function novaVenda() {
            // Resetar variáveis
            cliente = '';
            carrinho = [];
            
            // Limpar campos
            document.getElementById('nome-cliente').value = '';
            document.getElementById('nome-produto').value = '';
            document.getElementById('quantidade').value = '1';
            
            // Mostrar tela inicial
            document.getElementById('resumo-compra').classList.add('hidden');
            document.getElementById('area-vendas').classList.add('hidden');
            document.getElementById('cadastro-cliente').classList.remove('hidden');
            
            atualizarCarrinho();
        }
    </script>
</body>
</html>
